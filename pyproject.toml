[project]
name = "replenishment-poc"
version = "0.1.1"
description = "LLM-in-the-mix shelf replenishment POC (multi-store sim)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Greg Moyer" }]
keywords = ["llm", "replenishment", "retail", "kafka", "streamlit", "fastapi", "simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "kafka-python-ng>=2.2",
  "psycopg[binary]>=3.1",
  "streamlit>=1.38",
]

[project.urls]
Homepage = "https://github.com/gjmoyer/replenishment_poc"
Source = "https://github.com/gjmoyer/replenishment_poc"
Issues = "https://github.com/gjmoyer/replenishment_poc/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm", "decision", "sim", "core", "dashboard"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10,<2",
  "types-pyyaml>=6.0",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["core", "decision", "sim", "llm", "dashboard"]
# Streamlit UI and the live Kafka/entrypoint runner are exercised by the
# live demo and `make up`, not by the unit suite. Everything else is gated.
omit = ["dashboard/app.py", "sim/runner.py", "*/__init__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
