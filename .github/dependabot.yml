version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # mypy 2.x pulls ast-serialize, which has no wheel for Linux x86_64 on
      # Python 3.12/3.13 (breaks CI). Revisit once that's resolved upstream.
      - dependency-name: "mypy"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
    ignore:
      # requires-python is >=3.12,<3.14; don't propose a 3.14+ base image.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
