version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
    ignore:
      # requires-python is >=3.12,<3.14; don't propose a 3.14+ base image.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
