llm:
  provider: lmstudio
  # Local dev (native LM Studio on Mac): 127.0.0.1
  # From inside Docker Compose: http://host.docker.internal:8081/v1
  base_url: "http://127.0.0.1:8081/v1"
  model: "qwen2.5-7b-instruct-mlx"
  timeout_s: 30
  temperature: 0.2
  max_tokens: 300
  prompt_version: "v2"
  # Outcome-aware few-shots (doc/04 #2): labeled past same-trigger cases
  # retrieved per call. 0 = off (v1 behavior). Schema caps at 3.
  history_cases: 2
  history_pool: 20

sim:
  seed: 42
  day: { open: "07:00", close: "22:00" }
  trucks: ["10:30", "14:00"]
  associate_delay_min: 25
  stores:
    # Single-store demo (Downtown, 1.2x demand — pars are tuned for it).
    # The stack stays N-store generic: add entries here and every service
    # (sim, decision, dashboard) picks them up via stores_from_config.
    - { store_id: "store-001", name: "Downtown", rate_mult: 1.2 }
